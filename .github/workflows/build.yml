name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rivulet
          path: target/release/rivulet.exe
      - name: Attach the exe to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$env:GITHUB_REF_NAME" target/release/rivulet.exe --draft --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
