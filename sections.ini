# Changes apply at the next re-sort: right-click any label > Re-sort.

[general]
# Shows the desktop with your last section open; press again to go back. Leave empty to turn it off.
hotkey = ctrl+alt+d
# Which screen the labels sit on: 0 is the main screen; 1, 2... count from the left.
monitor = 0
# The rest can also be changed from the Settings label.
side = left
theme = wallpaper
speed = normal
dots = on
click_away = on
double_click_hide = on
style = plain
# Rivulet can draw the icons itself, so Explorer's hover boxes never show: icons = own.
# icons = explorer
# Appearance, also on Settings > Appearance:
# font = segoe ui        (calibri, arial, verdana, tahoma)
# text_size = normal     (small, large)
# icon_size = medium     (small, large)
# icon_tint = off        (section, mono)
# corners = soft         (square, round)
# panel = normal         (clear, solid)
# hover_open = off

# Which section each kind of item goes to.
# "folder" = folders, "system" = Recycle Bin, This PC. Anything unmatched goes to Other.
[types]
Folders = folder
Word = .docx .doc .rtf .odt
Excel = .xlsx .xls .xlsm .csv
PowerPoint = .pptx .ppt
PDF = .pdf
Notes = .md .txt
Colab & Code = .ipynb .py .bat .ps1
Zips = .zip .rar .7z .tar .gz
Apps = .lnk .url .exe system
Other =

# Name rules beat the types above. * matches anything; case does not matter.
# Dragging an icon onto a label adds a line here for you.
[names]
*colab* = Colab & Code

# Label order, top to bottom. Recent always comes first.
[layout]
column1 = Folders
column2 = Word, Excel, Notes
column3 = PDF, PowerPoint, Colab & Code
column4 = Apps, Zips, Other

# Label colours, as red-green-blue hex.
[colours]
Recent = F2C14E
Folders = E8A33D
Word = 3F8CFF
Excel = 2FB67A
PowerPoint = F0703A
PDF = E5484D
Notes = A9B4C2
Colab & Code = 38C6D9
Apps = 8E7CFF
Zips = C86BE0
Other = 8A94A6
Downloads = 4FC3F7

# Sections that show a folder without moving anything: label = folder.
# It lists the newest files; double-click one to open it. Delete the line to remove the label.
[portals]
Downloads = %USERPROFILE%\Downloads

# The Recent section: how far back it looks and how many it shows. days = 0 turns it off.
[recent]
days = 3
limit = 12
